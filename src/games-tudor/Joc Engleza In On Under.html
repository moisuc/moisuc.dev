<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mate's Classroom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: squared-notebook page. Header with stars and sound, three level tabs, one chunky "sticker" card as the stage.
   Mate the bee sits at the top of the stage and talks in a bubble; everything draggable is a thick-outlined sticker.
   Deliberately a single bright look (a classroom game for a screen on the wall), so every colour is set explicitly. */
:root{
  --paper:#F5F9FD; --grid:#DCE8F4; --card:#FFFFFF;
  --ink:#1E2A47; --ink-soft:#4A5878;
  --bee:#FFC42E; --bee-deep:#C98800; --bee-soft:#FFF1C7;
  --sky:#3E8EDE; --sky-soft:#DCEBFA;
  --leaf:#1F8556; --leaf-soft:#D6F2E3;
  --try:#B85A00; --try-soft:#FFE8CF;
  --f-display:'Fredoka','Trebuchet MS',ui-rounded,system-ui,sans-serif;
  --f-body:'Nunito','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font:800 16px/1.4 var(--f-body); color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  padding-block:14px 36px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-touch-callout:none;
}
button{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--sky);outline-offset:3px}

.top,.tabs,.stage{max-width:980px;margin-inline:auto}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:center;gap:10px;font:700 1.6rem/1 var(--f-display)}
.brand svg{width:56px;height:47px;flex:none}
.meta{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{display:flex;align-items:center;gap:.4em;font:600 1.15rem/1 var(--f-display);background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:.35em .85em}
.pill .star{color:var(--bee-deep);font-size:1.25rem}

.btn{font:600 1rem/1.1 var(--f-display);background:#fff;border:3px solid var(--ink);border-radius:14px;padding:.5em 1em;min-height:44px;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--bee)}
.btn.big{font-size:1.35rem;padding:.55em 1.5em}
.btn.small{padding:.35em .8em;font-size:.95rem;min-height:40px}
.btn[aria-pressed="true"]{background:var(--sky-soft)}

.tabs{margin-top:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tab{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;cursor:pointer;font:600 1.05rem/1.15 var(--f-display);min-height:56px}
.tab .n{flex:none;width:32px;height:32px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;background:var(--bee-soft);font-size:1.05rem}
.tab[aria-current="true"]{background:var(--bee);box-shadow:0 4px 0 var(--ink)}
.tab[aria-current="true"] .n{background:#fff}
.tab.done .n{background:var(--leaf);color:#fff;border-color:var(--ink)}
@media(max-width:560px){.tab{flex-direction:column;text-align:center;gap:4px;font-size:.92rem;padding:8px 6px}}

.stage{margin-top:14px;background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:16px}
.coach{display:flex;align-items:center;gap:16px}
.mate{width:92px;height:77px;flex:none;animation:bob 3.2s ease-in-out infinite}
.mate.hop{animation:hop .6s ease}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes hop{30%{transform:translateY(-16px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
.bubble{position:relative;flex:1;min-width:0;background:var(--sky-soft);border:3px solid var(--ink);border-radius:18px;padding:9px 16px}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;width:16px;height:16px;background:inherit;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateY(-50%) rotate(45deg)}
.bubble b{display:block;font:600 1.3rem/1.2 var(--f-display)}
.bubble span{display:block;font-size:.92rem;color:var(--ink-soft)}
.bubble.good{background:var(--leaf-soft)}
.bubble.try{background:var(--try-soft)}

.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin:14px 0 12px}
.prog{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;color:var(--ink-soft)}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dots i{width:15px;height:15px;border-radius:50%;border:2.5px solid var(--ink);background:#fff}
.dots i.on{background:var(--bee)}
.tools{display:flex;gap:8px}

/* draggables */
[data-drag]{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;position:relative}
[data-drag].dragging{z-index:100;cursor:grabbing;transition:none}
[data-drag].spring{transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
[data-drag].sel{outline:4px solid var(--bee-deep);outline-offset:3px}
.used{display:none!important}
.chip{display:inline-flex;align-items:center;min-height:50px;font:600 1.55rem/1 var(--f-display);background:#fff;border:3px solid var(--ink);border-radius:14px;padding:.3em .85em;box-shadow:0 4px 0 var(--ink)}
.chip.dragging,.tool.dragging{box-shadow:0 4px 0 var(--ink),0 16px 18px rgba(30,42,71,.25)}
.tool{width:clamp(78px,17vw,108px);background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px;box-shadow:0 4px 0 var(--ink)}
.tool svg,.pic svg{display:block;width:100%;height:auto;pointer-events:none}

/* drop zones */
.zone.over{background:var(--bee)!important;border-style:solid!important;border-color:var(--ink)!important}
.zone.hint{animation:pulse .7s ease-in-out 4}
.armed .zone:not(.off){animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,196,46,.7)}}

/* level 1 */
.grid1{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.card{flex:0 0 calc((100% - 24px)/3);min-width:0;background:#F4F9FE;border:2.5px solid var(--grid);border-radius:16px;padding:8px}
@media(min-width:760px){.card{flex-basis:calc((100% - 48px)/5)}}
.pic{padding:4px 8px;max-width:130px;margin-inline:auto}
.slot{display:flex;align-items:center;justify-content:center;min-height:56px;margin-top:6px;padding:2px 6px;text-align:center;background:#fff;border:3px dashed var(--sky);border-radius:14px;font:600 1.25rem/1.1 var(--f-display)}
.slot.filled{border-style:solid;border-color:var(--leaf);background:var(--leaf-soft);color:var(--leaf)}
.pool{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:16px;padding:16px;min-height:84px;background:var(--bee-soft);border:3px dashed #E2BC55;border-radius:16px}

/* levels 2 and 3 */
.task{text-align:center;margin:4px 0 0}
.sentence{margin:0;font:600 clamp(1.3rem,4.3vw,2.1rem)/1.45 var(--f-display)}
.sentence mark{background:var(--bee);color:var(--ink);border-radius:8px;padding:0 .28em}
.sentence.ok{color:var(--leaf)}
.ro{display:none;margin:.2em 0 0;color:var(--ink-soft)}
.show-ro .ro{display:block}
.blank{display:inline-block;min-width:3.4em;min-height:1.5em;vertical-align:middle;padding:0 .3em;background:var(--sky-soft);border:3px dashed var(--sky);border-radius:12px}
.blank.filled{border-style:solid;border-color:var(--leaf);background:var(--leaf-soft);color:var(--leaf)}
.rule{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:8px}
.rule>div{display:flex;align-items:center;gap:8px;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:4px 12px;font:600 1rem/1.2 var(--f-display)}
.mini{display:flex}.mini svg{width:36px;height:27px}
.count{display:inline-flex;align-items:center;justify-content:center;min-width:2.2em;height:2.2em;margin-left:.4em;border-radius:50%;background:var(--bee);border:3px solid var(--ink);font:700 1.2rem/1 var(--f-display)}
.countrow{display:flex;justify-content:center;align-items:center;margin-top:6px;color:var(--ink-soft)}

.scene{position:relative;container-type:inline-size;width:100%;max-width:720px;margin:12px auto;aspect-ratio:2/1;border:3px solid var(--ink);border-radius:18px}
.scene .bg{position:absolute;inset:0;width:100%;height:100%;border-radius:15px;overflow:hidden}
.sz{position:absolute;border:3px dashed rgba(62,142,222,.75);border-radius:14px;background:rgba(62,142,222,.08)}
.sz.zon{left:9.4%;top:1.9%;width:46.9%;height:37.5%}
.sz.zun{left:16.6%;top:46.9%;width:32.5%;height:41.25%}
.sz.bag{left:67.2%;top:12.5%;width:26.6%;height:76.25%;background:none;border-color:transparent}
.sz.bag .hit{position:absolute;inset:0;border:3px dashed rgba(62,142,222,.75);border-radius:14px;background:rgba(62,142,222,.08)}
.sz.bag.over .hit{background:var(--bee);border-style:solid;border-color:var(--ink)}
.sz.bag.over{background:none!important;border-color:transparent!important}
.scene.static .sz{border-color:transparent;background:none}
.scene.static .tag,.scene.static .hit{display:none}
.tag{position:absolute;left:6px;top:5px;z-index:3;pointer-events:none;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:.18em .6em;font:700 clamp(.6rem,2.3cqw,.85rem)/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.stack{position:absolute;inset:0;z-index:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:.5%;pointer-events:none}
.placed{width:calc(clamp(34px,11.5cqw,84px)*var(--w,1)*1.25);margin-inline:.4cqw;pointer-events:auto;transform-origin:50% 100%;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.placed svg{display:block;width:100%;height:auto}
.placed.rm{cursor:pointer}
@keyframes pop{from{transform:scale(.4)}}
.sz.bag .stack{inset:0 0 auto 0;height:52%;padding-bottom:0}
.bag-mouth{position:absolute;left:5%;right:5%;top:39%;height:8%;z-index:0;border:3px solid var(--ink);border-radius:50%;background:#8E2F36;pointer-events:none}
.bag-body{position:absolute;left:5%;right:5%;top:44%;bottom:0;z-index:2;background:#E5484D;border:3px solid var(--ink);border-radius:22px 22px 14px 14px;pointer-events:none}
.bag-body i{position:absolute;left:18%;right:18%;bottom:12%;height:36%;border:3px solid var(--ink);border-radius:12px;background:rgba(0,0,0,.16)}
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:6px;padding:14px;background:var(--bee-soft);border:3px dashed #E2BC55;border-radius:16px}
.nextrow{text-align:center;margin-top:14px;min-height:62px}

.done{text-align:center;padding:10px 0 4px}
.done .mate{width:170px;height:142px;margin:0 auto;display:block}
.done h2{margin:.2em 0 0;font:700 2.1rem/1.15 var(--f-display)}
.done p{margin:.2em 0 1em;color:var(--ink-soft)}
.done .row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.confetti{position:fixed;inset:0;z-index:200;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:10px;height:15px;border-radius:2px;animation:fall 2.1s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
@media(max-width:560px){.stage{padding:12px}.mate{width:72px;height:60px}.coach{gap:14px}.bubble b{font-size:1.12rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<svg style="position:absolute;width:0;height:0" aria-hidden="true" focusable="false">
  <defs><clipPath id="mbody"><ellipse cx="66" cy="62" rx="40" ry="28"/></clipPath></defs>

      <ellipse cx="78" cy="24" rx="14" ry="21" transform="rotate(14 78 24)" fill="#DDF0FF"/>
      <ellipse cx="66" cy="62" rx="40" ry="28" fill="#FFC42E"/>
      <g clip-path="url(#mbody)" stroke="none" fill="#1E2A47"><rect x="58" y="30" width="9" height="64"/><rect x="78" y="30" width="9" height="64"/><rect x="98" y="30" width="9" height="64"/></g>
      <ellipse cx="66" cy="62" rx="40" ry="28" fill="none"/>

<header class="top">
  <div class="brand"><svg viewBox="0 0 120 100" aria-hidden="true"><use href="#mate"/></svg><span>Mate's Classroom</span></div>
  <div class="meta">
    <div class="pill" title="Stars"><span class="star" aria-hidden="true">★</span><span id="stars">0</span></div>
    <button class="btn small" id="sound" type="button" aria-pressed="true">Sound: on</button>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="Levels">
  <button class="tab" type="button" data-level="1"><span class="n">1</span><span class="t">Objects</span></button>
  <button class="tab" type="button" data-level="2"><span class="n">2</span><span class="t">In · On · Under</span></button>
  <button class="tab" type="button" data-level="3"><span class="n">3</span><span class="t">There is · There are</span></button>
</nav>

<main class="stage" id="stage">
  <div class="coach">
    <svg class="mate" viewBox="0 0 120 100" aria-hidden="true"><use href="#mate"/></svg>
    <div class="bubble" id="bubble" aria-live="polite"><b id="b-en"></b><span id="b-ro"></span></div>
  </div>
  <div class="bar">
    <div class="prog" id="prog"></div>
    <div class="tools">
      <button class="btn small" id="ro" type="button" aria-pressed="false">RO ajutor</button>
      <button class="btn small" id="restart" type="button">↺ Restart</button>
    </div>
  </div>
  <div id="play"></div>
</main>

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const INK='#1E2A47';
const COL={red:'#E5484D',blue:'#3E8EDE',green:'#35A56A',yellow:'#F7C531',pink:'#F58FB0',purple:'#8B5FD1',orange:'#F28C38',brown:'#B07A47'};
const KIND={pencil:{en:'pencil',pl:'pencils'},pen:{en:'pen',pl:'pens'},rubber:{en:'rubber',pl:'rubbers'},ruler:{en:'ruler',pl:'rulers'},book:{en:'book',pl:'books'},case:{en:'pencil case',pl:'pencil cases'},bag:{en:'schoolbag',pl:'schoolbags'}};
const PLACE={on:'the desk',under:'the desk',in:'the schoolbag'};
const WORDN=['','one','two','three','four'];
const GOOD=[['Great job!','Foarte bine!'],['Super!','Super!'],['Well done!','Bravo!'],['Perfect!','Perfect!'],['You got it!','Ai reușit!']];
const TRY=[['Try again!','Mai încearcă!'],['Almost! Look again.','Aproape! Privește din nou.'],['Hmm, not there. Try again!','Hmm, nu acolo. Mai încearcă!']];

/* ---------- pictures ---------- */
/* tight crops (x,y,w,h) so objects sit on the desk and inside the bag instead of floating */
const CROP={pencil:[4,21,74,18],pen:[6,18,72,20],rubber:[10,14,60,34],ruler:[2,14,76,32],book:[10,4,60,52],bag:[7,0,66,58],case:[3,3,74,45]};
function ico(k,c,crop){
  const f=COL[c]||c;let g='';
  switch(k){
    case 'pencil':g=`<rect x="14" y="23" width="46" height="14" fill="${f}"/><rect x="6" y="23" width="9" height="14" rx="3" fill="#F59BB8"/><path d="M60 23V37L76 30Z" fill="#F6DDB0"/><path d="M70.5 27V33L76 30Z" fill="${INK}"/><path d="M15 30H59" stroke-opacity=".3"/>`;break;
    case 'pen':g=`<rect x="8" y="25" width="54" height="11" rx="5" fill="${f}"/><rect x="16" y="20" width="26" height="5" rx="2.5" fill="#fff"/><path d="M62 26V35L76 30.5Z" fill="#E4E8F0"/><path d="M34 25V36" stroke-opacity=".4"/>`;break;
    case 'rubber':g=`<rect x="12" y="16" width="56" height="30" rx="7" fill="${f}"/><rect x="30" y="16" width="20" height="30" fill="#fff"/>`;break;
    case 'ruler':g=`<rect x="3" y="16" width="74" height="28" rx="3" fill="${f}"/>`+Array.from({length:13},(_,i)=>`<path d="M${(9+i*5.6).toFixed(1)} 16V${16+(i%5===0?12:7)}"/>`).join('');break;
    case 'book':g=`<rect x="12" y="6" width="50" height="48" rx="4" fill="${f}"/><rect x="62" y="9" width="6" height="42" fill="#fff"/><rect x="12" y="6" width="9" height="48" rx="4" fill="rgba(0,0,0,.2)"/><rect x="27" y="14" width="28" height="12" rx="2" fill="#fff"/><path d="M27 35H53M27 42H46"/>`;break;
    case 'bag':g=`<path d="M31 14C31 2 49 2 49 14" fill="none"/><rect x="9" y="24" width="9" height="22" rx="4" fill="${f}"/><rect x="62" y="24" width="9" height="22" rx="4" fill="${f}"/><rect x="16" y="10" width="48" height="46" rx="12" fill="${f}"/><rect x="24" y="31" width="32" height="20" rx="6" fill="rgba(0,0,0,.16)"/><path d="M16 25H64M24 39H56" fill="none"/>`;break;
    case 'case':g=`<path d="M22 20L26 7L31 20Z" fill="#F7C531"/><path d="M36 20L40 5L45 20Z" fill="#8B5FD1"/><rect x="4" y="18" width="72" height="28" rx="13" fill="${f}"/><path d="M14 32H66" stroke-dasharray="4 3" fill="none"/><rect x="58" y="29" width="10" height="6" rx="3" fill="#fff"/>`;break;
    case 'desk':g=`<rect x="10" y="25" width="7" height="31" fill="${f}"/><rect x="63" y="25" width="7" height="31" fill="${f}"/><rect x="17" y="35" width="46" height="5" fill="${f}"/><rect x="4" y="15" width="72" height="10" rx="3" fill="#D39A5F"/>`;break;
    case 'chair':g=`<rect x="22" y="38" width="6" height="19" fill="${f}"/><rect x="52" y="38" width="6" height="19" fill="${f}"/><rect x="18" y="4" width="26" height="17" rx="4" fill="${f}"/><rect x="18" y="21" width="42" height="9" rx="3" fill="#D39A5F"/><rect x="18" y="30" width="6" height="8" fill="${f}"/>`;break;
  }
  const vb=crop&&CROP[k]?CROP[k].join(' '):'0 0 80 60';
  return `<svg class="ico" viewBox="${vb}" aria-hidden="true"><g stroke="${INK}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">${g}</g></svg>`;
}
const BG=`<svg class="bg" viewBox="0 0 640 320" preserveAspectRatio="none" aria-hidden="true"><rect width="640" height="320" fill="#E3F0FB"/><rect y="284" width="640" height="36" fill="#EBD9B4"/><g stroke="${INK}" stroke-width="3" stroke-linejoin="round"><path d="M0 284H640"/><rect x="76" y="144" width="16" height="140" fill="#B07A47"/><rect x="328" y="144" width="16" height="140" fill="#B07A47"/><rect x="92" y="162" width="236" height="10" fill="#B07A47"/><rect x="60" y="124" width="300" height="22" rx="7" fill="#D39A5F"/></g></svg>`;
function scene(active){
  return `<div class="scene${active?'':' static'}" id="scene">${BG}
   <div class="zone sz zon" data-place="on"><div class="stack"></div><span class="tag">on the desk</span></div>
   <div class="zone sz zun" data-place="under"><div class="stack"></div><span class="tag">under the desk</span></div>
   <div class="zone sz bag" data-place="in"><div class="hit"></div><div class="bag-mouth"></div><div class="stack"></div><div class="bag-body"><i></i></div><span class="tag">in the schoolbag</span></div></div>`;
}
function place(zone,k,c,removable){
  const d=document.createElement('div');d.className='placed'+(removable?' rm':'');d.dataset.k=k;d.dataset.c=c;d.innerHTML=ico(k,c,true);
  d.style.setProperty('--w',CROP[k][2]/80);
  zone.querySelector('.stack').appendChild(d);
}

/* ---------- sound ---------- */
const S={level:1,stars:0,done:{},sound:true};
let ac=null;
function tone(freqs,dur){
  if(!S.sound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime;
    freqs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(ac.destination);const s=t+i*dur;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.16,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+dur*1.8);o.start(s);o.stop(s+dur*2);});
  }catch(e){}
}
const sGood=()=>tone([523,659,784],.11), sSoft=()=>tone([330,294],.14), sPop=()=>tone([659],.09);
function speak(t){
  if(!S.sound||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u);}catch(e){}
}

/* ---------- ui helpers ---------- */
const stage=$('#stage'), play=$('#play');
let L={drop(){return false;}}, sel=null;
function say(en,ro,mood){
  const b=$('#bubble');b.className='bubble '+(mood||'');
  $('#b-en').textContent=en;$('#b-ro').textContent=ro||'';
  if(mood==='good'){const m=$('.coach .mate');m.classList.remove('hop');void m.getBoundingClientRect();m.classList.add('hop');}
}
$('.coach .mate').addEventListener('animationend',e=>{if(e.animationName==='hop')e.target.classList.remove('hop');});
function prog(label,cur,total){
  $('#prog').innerHTML=`<span>${label}</span><span class="dots" role="img" aria-label="${cur} of ${total}">${Array.from({length:total},(_,i)=>`<i class="${i<cur?'on':''}"></i>`).join('')}</span>`;
}
function addStar(){S.stars++;$('#stars').textContent=S.stars;}
function good(){const g=rnd(GOOD);say(g[0],g[1],'good');sGood();}
function tryAgain(en,ro){const t=rnd(TRY);say(en||t[0],ro||t[1],'try');sSoft();}
function showRO(on){stage.classList.toggle('show-ro',on);$('#ro').setAttribute('aria-pressed',String(on));}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const box=document.createElement('div');box.className='confetti';
  const cols=['#FFC42E','#3E8EDE','#35A56A','#F59BB8','#8B5FD1','#F28C38'];
  for(let i=0;i<40;i++){const s=document.createElement('i');s.style.cssText=`left:${Math.random()*100}%;background:${cols[i%6]};animation-delay:${(Math.random()*.5).toFixed(2)}s;--dx:${Math.round(Math.random()*180-90)}px;--r:${Math.round(Math.random()*720)}deg`;box.appendChild(s);}
  document.body.appendChild(box);setTimeout(()=>box.remove(),2900);
}
function complete(n){
  S.done[n]=true;markTabs();confetti();sGood();select(null);
  L={drop(){return false;}};
  prog(`Level ${n} complete`,1,1);
  play.innerHTML=`<div class="done"><svg class="mate" viewBox="0 0 120 100" aria-hidden="true"><use href="#mate"/></svg>
    <h2>${n<3?`Level ${n} complete!`:'You finished all levels!'}</h2><p>${n<3?'Bravo! Ai terminat nivelul.':'Felicitări! Poți juca din nou oricând.'}</p>
    <div class="row"><button class="btn" id="again" type="button">↺ Play again</button>${n<3?'<button class="btn primary big" id="nextlvl" type="button">Next level ➜</button>':''}</div></div>`;
  say(n<3?'You did it!':'Amazing! You are a star!',n<3?'Felicitări!':'Ești o stea!','good');
  $('#again').onclick=()=>go(n);
  const nb=$('#nextlvl');if(nb)nb.onclick=()=>go(n+1);
}
function markTabs(){
  document.querySelectorAll('.tab').forEach(t=>{
    const n=+t.dataset.level;t.classList.toggle('done',!!S.done[n]);
    t.setAttribute('aria-current',String(n===S.level));
    t.querySelector('.n').textContent=S.done[n]?'✓':n;
  });
}

/* ---------- drag and drop (pointer events, so touch, mouse and multi-touch all work) ---------- */
const drags=new Map();
function zoneAt(x,y){return document.elementsFromPoint(x,y).find(n=>n.classList&&n.classList.contains('zone')&&!n.classList.contains('off'))||null;}
function select(el){
  if(sel)sel.classList.remove('sel');
  sel=el;if(el)el.classList.add('sel');
  stage.classList.toggle('armed',!!el);
}
function handleDrop(el,z){
  const r=L.drop(el,z);
  if(r==='consume')el.classList.add('used');
  select(null);
  return r;
}
function spring(el){el.classList.add('spring');el.style.transform='';setTimeout(()=>el.classList.remove('spring'),340);}
stage.addEventListener('pointerdown',e=>{
  const el=e.target.closest('[data-drag]');
  if(!el||el.classList.contains('used'))return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  e.preventDefault();
  try{el.setPointerCapture(e.pointerId);}catch(_){}
  drags.set(e.pointerId,{el,sx:e.clientX,sy:e.clientY,moved:false,over:null});
});
stage.addEventListener('pointermove',e=>{
  const d=drags.get(e.pointerId);if(!d)return;
  const dx=e.clientX-d.sx,dy=e.clientY-d.sy;
  if(!d.moved){if(Math.hypot(dx,dy)<7)return;d.moved=true;d.el.classList.remove('spring');d.el.classList.add('dragging');}
  d.el.style.transform=`translate(${dx}px,${dy}px) scale(1.07) rotate(-3deg)`;
  const z=zoneAt(e.clientX,e.clientY);
  if(z!==d.over){if(d.over)d.over.classList.remove('over');if(z)z.classList.add('over');d.over=z;}
});
function release(e,cancel){
  const d=drags.get(e.pointerId);if(!d)return;drags.delete(e.pointerId);
  const el=d.el;el.classList.remove('dragging');
  if(d.over)d.over.classList.remove('over');
  if(!d.moved){el.style.transform='';if(!cancel)tap(el);return;}
  const z=cancel?null:zoneAt(e.clientX,e.clientY);
  const r=z?handleDrop(el,z):false;
  if(r==='consume'){el.style.transform='';}else spring(el);
}
stage.addEventListener('pointerup',e=>release(e,false));
stage.addEventListener('pointercancel',e=>release(e,true));
function tap(el){
  if(el.dataset.word)speak(el.dataset.word);
  select(el===sel?null:el);
}
stage.addEventListener('click',e=>{
  const z=e.target.closest('.zone');
  if(!z||!sel||z.classList.contains('off')||e.target.closest('.placed'))return;
  handleDrop(sel,z);
});
stage.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  const d=e.target.closest('[data-drag]'),z=e.target.closest('.zone');
  if(d){e.preventDefault();tap(d);}
  else if(z&&sel&&!z.classList.contains('off')){e.preventDefault();handleDrop(sel,z);}
});

/* ---------- level 1: objects ---------- */
function level1(){
  const items=[['pencil','pencil','green'],['pen','pen','purple'],['rubber','rubber','pink'],['ruler','ruler','yellow'],['book','book','blue'],['schoolbag','bag','red'],['pencil case','case','orange'],['desk','desk','brown'],['chair','chair','brown']];
  let matched=0;const miss={};
  play.innerHTML=`<div class="grid1">${items.map(([w,k,c])=>`<div class="card"><div class="pic">${ico(k,c)}</div><div class="slot zone" data-word="${w}" tabindex="0" role="button" aria-label="Empty slot"></div></div>`).join('')}</div>
   <div class="pool">${shuffle(items.map(i=>i[0])).map(w=>`<div class="chip" data-drag data-word="${w}" tabindex="0" role="button">${w}</div>`).join('')}</div>`;
  prog('Matched',0,items.length);
  say('Drag each word to its picture!','Trage fiecare cuvânt la imaginea lui.');
  return {drop(chip,zone){
    const w=chip.dataset.word;
    if(zone.dataset.word===w&&!zone.classList.contains('filled')){
      zone.classList.add('filled','off');zone.textContent=w;zone.removeAttribute('tabindex');
      matched++;addStar();prog('Matched',matched,items.length);good();speak(w);
      if(matched===items.length)setTimeout(()=>complete(1),900);
      return 'consume';
    }
    miss[w]=(miss[w]||0)+1;tryAgain();
    if(miss[w]>=2){const t=play.querySelector(`.slot[data-word="${w}"]`);if(t){t.classList.remove('hint');void t.offsetWidth;t.classList.add('hint');setTimeout(()=>t.classList.remove('hint'),3000);}}
    return false;
  }};
}

/* ---------- level 2: in, on, under ---------- */
const DIS=[['pen','blue'],['book','orange'],['ruler','red'],['pencil','purple'],['rubber','green'],['case','blue'],['book','green'],['pen','red'],['ruler','yellow'],['pencil','orange']];
function others(k){const seen=new Set([k]),out=[];for(const d of shuffle(DIS)){if(!seen.has(d[0])){seen.add(d[0]);out.push(d);if(out.length===3)break;}}return out;}
const toolHTML=(k,c)=>`<div class="tool" data-drag data-k="${k}" data-c="${c}" tabindex="0" role="button" aria-label="${c} ${KIND[k].en}">${ico(k,c)}</div>`;
function level2(){
  const R=[
    {k:'book',c:'blue',p:'on',ro:'Pune cartea albastră pe birou.'},
    {k:'case',c:'red',p:'in',ro:'Pune penarul roșu în ghiozdan.'},
    {k:'pencil',c:'green',p:'under',ro:'Pune creionul verde sub birou.'},
    {k:'pen',c:'purple',p:'in',ro:'Pune pixul mov în ghiozdan.'},
    {k:'ruler',c:'yellow',p:'on',ro:'Pune rigla galbenă pe birou.'},
    {k:'rubber',c:'pink',p:'under',ro:'Pune radiera roz sub birou.'}];
  let i=0,misses=0,done=false;
  function render(){
    const r=R[i];misses=0;done=false;
    const tools=shuffle([[r.k,r.c],...others(r.k)]);
    play.innerHTML=`<div class="task"><p class="sentence" id="sent">Put the <b>${r.c} ${KIND[r.k].en}</b> <mark>${r.p}</mark> ${PLACE[r.p]}.</p><p class="ro">${r.ro}</p></div>
      ${scene(true)}<div class="tray">${tools.map(t=>toolHTML(t[0],t[1])).join('')}</div>
      <div class="nextrow"><button class="btn primary big" id="next" type="button" hidden>${i<R.length-1?'Next ➜':'Finish ➜'}</button></div>`;
    prog(`Round ${i+1} of ${R.length}`,i,R.length);
    say('Read it. Then drag!','Citește, apoi trage!');
    $('#next').onclick=()=>{if(i<R.length-1){i++;render();}else complete(2);};
  }
  render();
  return {drop(el,zone){
    if(done)return false;
    const r=R[i];
    const okItem=el.dataset.k===r.k&&el.dataset.c===r.c, okPlace=zone.dataset.place===r.p;
    if(okItem&&okPlace){
      done=true;place(zone,r.k,r.c,false);
      play.querySelectorAll('.zone').forEach(z=>z.classList.add('off'));
      $('#sent').classList.add('ok');$('#next').hidden=false;
      addStar();prog(`Round ${i+1} of ${R.length}`,i+1,R.length);good();
      speak(`The ${r.c} ${KIND[r.k].en} is ${r.p} ${PLACE[r.p]}.`);
      return 'consume';
    }
    misses++;
    if(!okItem)tryAgain(`Find the ${r.c} ${KIND[r.k].en}!`,'Caută obiectul din propoziție.');
    else tryAgain(`Read again: ${r.p.toUpperCase()}!`,'Citește din nou unde trebuie pus.');
    if(misses>=2){
      showRO(true);
      const z=play.querySelector(`.zone[data-place="${r.p}"]`);
      if(z){z.classList.remove('hint');void z.offsetWidth;z.classList.add('hint');setTimeout(()=>z.classList.remove('hint'),3000);}
    }
    return false;
  }};
}

/* ---------- level 3: there is / there are ---------- */
function level3(){
  const R=[
    {t:'a',k:'book',c:'blue',n:1,p:'on',ro:'Este o carte albastră pe birou.'},
    {t:'a',k:'pencil',c:'green',n:3,p:'under',ro:'Sunt trei creioane verzi sub birou.'},
    {t:'a',k:'pen',c:'purple',n:2,p:'in',ro:'Sunt două pixuri mov în ghiozdan.'},
    {t:'a',k:'ruler',c:'yellow',n:1,p:'on',ro:'Este o riglă galbenă pe birou.'},
    {t:'b',k:'rubber',c:'red',n:2,p:'on',ro:'Sunt două radiere roșii pe birou.'},
    {t:'b',k:'pencil',c:'green',n:3,p:'under',ro:'Sunt trei creioane verzi sub birou.'},
    {t:'b',k:'book',c:'blue',n:2,p:'in',ro:'Sunt două cărți albastre în ghiozdan.'}];
  let i=0,done=false,count=0,misses=0;
  const rule=`<div class="rule"><div><span class="mini">${ico('pen','purple')}</span><span>There <b>IS</b> a pen.</span></div><div><span class="mini">${ico('pen','purple')}${ico('pen','blue')}</span><span>There <b>ARE</b> two pens.</span></div></div>`;
  function render(){
    const r=R[i];done=false;count=0;misses=0;
    const noun=r.n===1?KIND[r.k].en:KIND[r.k].pl, num=r.n===1?'a':WORDN[r.n];
    const label=`Round ${i+1} of ${R.length} · ${r.t==='a'?'Is or are?':'Build it!'}`;
    if(r.t==='a'){
      play.innerHTML=`${rule}<div class="task"><p class="sentence" id="sent">There <span class="blank zone" data-ans="${r.n===1?'is':'are'}" tabindex="0" role="button" aria-label="blank"></span> ${num} ${r.c} ${noun} ${r.p} ${PLACE[r.p]}.</p><p class="ro">${r.ro}</p></div>
        ${scene(false)}
        <div class="tray"><div class="chip" data-drag data-word="is" tabindex="0" role="button">is</div><div class="chip" data-drag data-word="are" tabindex="0" role="button">are</div></div>
        <div class="nextrow"><button class="btn primary big" id="next" type="button" hidden>Next ➜</button></div>`;
      const z=play.querySelector(`.sz[data-place="${r.p}"]`);
      for(let j=0;j<r.n;j++)place(z,r.k,r.c,false);
      say('One thing or many things?','Un lucru sau mai multe?');
    }else{
      const tools=shuffle([[r.k,r.c],...others(r.k).slice(0,2)]);
      play.innerHTML=`${rule}<div class="task"><p class="sentence" id="sent">There ${r.n===1?'is':'are'} <mark>${num}</mark> ${r.c} ${noun} ${r.p} ${PLACE[r.p]}.</p><p class="ro">${r.ro}</p></div>
        ${scene(true)}
        <div class="tray">${tools.map(t=>toolHTML(t[0],t[1])).join('')}</div>
        <div class="countrow"><span>Placed:</span><span class="count" id="cnt">0</span></div>
        <div class="nextrow"><button class="btn primary big" id="next" type="button" hidden>${i<R.length-1?'Next ➜':'Finish ➜'}</button></div>`;
      $('#scene').addEventListener('click',e=>{
        const p=e.target.closest('.placed.rm');if(!p||done)return;
        e.stopPropagation();p.remove();count--;$('#cnt').textContent=count;sPop();
      });
      say('Build the picture! Count the things.','Construiește imaginea! Numără obiectele.');
    }
    prog(label,i,R.length);
    $('#next').onclick=()=>{if(i<R.length-1){i++;render();}else complete(3);};
  }
  function win(){
    done=true;$('#sent').classList.add('ok');$('#next').hidden=false;
    play.querySelectorAll('.zone').forEach(z=>z.classList.add('off'));
    addStar();prog(`Round ${i+1} of ${R.length} · ${R[i].t==='a'?'Is or are?':'Build it!'}`,i+1,R.length);good();
    speak($('#sent').textContent.replace(/\s+/g,' '));
  }
  render();
  return {drop(el,zone){
    if(done)return false;
    const r=R[i];
    if(r.t==='a'){
      if(zone.dataset.ans===el.dataset.word){
        zone.textContent=el.dataset.word;zone.classList.add('filled');
        win();return 'consume';
      }
      tryAgain('Count the things first!','Numără mai întâi! Unul → IS, mai multe → ARE.');
      return false;
    }
    const okItem=el.dataset.k===r.k&&el.dataset.c===r.c, okPlace=zone.dataset.place===r.p;
    if(!okItem){tryAgain(`Look: ${r.c} ${KIND[r.k].pl}!`,'Citește propoziția și caută obiectul.');return false;}
    if(!okPlace){misses++;tryAgain(`Read again: ${r.p.toUpperCase()}!`,'Citește din nou unde trebuie pus.');
      if(misses>=2){showRO(true);const z=play.querySelector(`.zone[data-place="${r.p}"]`);if(z){z.classList.remove('hint');void z.offsetWidth;z.classList.add('hint');setTimeout(()=>z.classList.remove('hint'),3000);}}
      return false;}
    if(count>=r.n){tryAgain(`Only ${WORDN[r.n]}!`,'Sunt destule. Atinge un obiect ca să-l scoți.');return false;}
    place(zone,r.k,r.c,true);count++;$('#cnt').textContent=count;
    if(count===r.n)win();else{sPop();say(`${count}... keep going!`,`${count}... mai pune!`);}
    return false;
  }};
}

/* ---------- wiring ---------- */
const levels={1:level1,2:level2,3:level3};
function go(n){
  select(null);S.level=n;showRO(false);
  $('#ro').hidden=(n===1);
  L=levels[n]();markTabs();
}
$('#tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(t)go(+t.dataset.level);});
$('#restart').addEventListener('click',()=>go(S.level));
$('#ro').addEventListener('click',()=>showRO(!stage.classList.contains('show-ro')));
$('#sound').addEventListener('click',e=>{
  S.sound=!S.sound;e.currentTarget.setAttribute('aria-pressed',String(S.sound));e.currentTarget.textContent='Sound: '+(S.sound?'on':'off');
  if(!S.sound&&'speechSynthesis' in window){try{speechSynthesis.cancel();}catch(_){}}
});
go(1);
})();
</script>
